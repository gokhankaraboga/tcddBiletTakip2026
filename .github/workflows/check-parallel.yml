name: TCDD Parallel Check

on:
  workflow_dispatch:
    inputs:
      send_telegram:
        description: "Telegram bildirimi gönderilsin mi?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  repository_dispatch:
    types: [tcdd-check]

permissions:
  contents: read
  packages: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      combo_indexes: ${{ steps.matrix.outputs.combo_indexes }}
      combo_count: ${{ steps.matrix.outputs.combo_count }}
      send_telegram: ${{ steps.send.outputs.send_telegram }}
    steps:
      - name: Resolve send_telegram value
        id: send
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_telegram=${{ inputs.send_telegram }}" >> "$GITHUB_OUTPUT"
          else
            echo "send_telegram=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build matrix from DEPARTURE_INFO_JSON
        id: matrix
        env:
          DEPARTURE_INFO_JSON: ${{ secrets.DEPARTURE_INFO_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("DEPARTURE_INFO_JSON", "").strip()
          if not raw:
              raise SystemExit("DEPARTURE_INFO_JSON secret is empty or missing.")

          data = json.loads(raw)
          if isinstance(data, dict):
              searches = data.get("searches", [])
          elif isinstance(data, list):
              searches = data
          else:
              searches = []
          if not isinstance(searches, list):
              searches = []

          indexes = list(range(len(searches)))
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"combo_indexes={json.dumps(indexes)}\n")
              f.write(f"combo_count={len(indexes)}\n")
          PY

  run-checks:
    needs: prepare-matrix
    if: needs.prepare-matrix.outputs.combo_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        combo_index: ${{ fromJson(needs.prepare-matrix.outputs.combo_indexes) }}
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository_owner }}/tcdd-bilet-takip:latest

      - name: Run combo in container
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPARTURE_INFO_JSON: ${{ secrets.DEPARTURE_INFO_JSON }}
          SEND_TELEGRAM: ${{ needs.prepare-matrix.outputs.send_telegram }}
        run: |
          docker run --rm \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -e DEPARTURE_INFO_JSON \
            -e SEND_TELEGRAM \
            -e COMBO_INDEX=${{ matrix.combo_index }} \
            ghcr.io/${{ github.repository_owner }}/tcdd-bilet-takip:latest
